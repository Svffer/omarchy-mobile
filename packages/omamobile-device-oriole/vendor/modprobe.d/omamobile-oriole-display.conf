# The display (device/oriole/DISPLAY-PLAN.md, D3-D6 passed 2026-11-08):
# gs-decon takes the bootloader's pipeline over from simpledrm at boot, the
# S6E3FC3 panel driver gives brightness, display on/off and the 60/90 Hz
# switch, gs-dsim-cmd the link timers for both rates. gs-decon offers 90 Hz
# as the preferred mode (its default ceiling, 120, is above the panel's);
# "options gs_decon max_refresh=60" would pin the bootloader's 60 Hz.
# The DSIM command path may send DCS to the S6E3FC3: brightness and display
# on/off (raven's omamobile-raven.conf). allow_tx is read-only at runtime and
# off by default, and without it every brightness write went nowhere
# (2026-11-08).
options gs_dsim_cmd allow_tx=1
softdep gs_decon pre: panel_samsung_s6e3fc3
# DPMS off stops DECON's frames and puts the panel to sleep (display off,
# sleep in), DPMS on runs its cold init (SUSPEND-PLAN 2026-11-08, as
# cheetah's): without it gs-decon kept scanning black frames at 60 Hz into
# a powered panel through every sleep.
options gs_decon screen_off=2
