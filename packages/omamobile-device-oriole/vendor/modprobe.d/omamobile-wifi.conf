# Wi-Fi bring-up (device/oriole/WIFI-PLAN.md): the device tree now describes
# the BCM4389 on PCIe GEN4A_1 (kernel gs101-pcie, gs101-pcie-phy), so these
# would autoload at boot. Until the link has been seen up on this phone
# (W2/W3, loaded by hand with tools/wifi-w1-capture under the watchdog) they
# stay out: a PCIe register access with the PHY isolated hangs the SoC.
# The SysMMU DMA-window helper is not used on gs101 (raven): brcmfmac's
# buffers come from the restricted DMA pool.
blacklist pcie_gs201
blacklist phy_gs201_pcie
blacklist pcie_gs201_sysmmu
blacklist brcmfmac
