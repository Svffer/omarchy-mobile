# Wi-Fi PCIe (device/oriole/WIFI-PLAN.md): the BCM4389 on gs101's PCIe
# GEN4A_1. The controller (pcie_gs201 with its gs101 variant), the PHY and
# brcmfmac load at boot: W1-W4 passed by hand under the watchdog on
# 2026-11-08 (link Gen2 x1 on the first try, firmware 20.101.90, scans). As
# on raven, the SysMMU DMA-window helper is not used: brcmfmac's buffers come
# from the restricted DMA pool, and PCIe shares the HSI2 SysMMU's VID 0 with
# UFS.
blacklist pcie_gs201_sysmmu
