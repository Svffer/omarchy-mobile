# SPDX-License-Identifier: MIT
# Unqualified coldplug matches: block aliases and direct modprobe.
# clk_acpm is the GPU's clock provider over ACPM (GS101_CLK_ACPM_GPU in the
# gpu node): without it panfrost defers forever ("get clock failed -517",
# 2026-11-08). Raven loads it at boot; so does oriole now.
blacklist max77759_charger
install max77759_charger /bin/false
blacklist gpio_max77759
install gpio_max77759 /bin/false
blacklist arm_dsu_pmu
install arm_dsu_pmu /bin/false
blacklist at24
install at24 /bin/false
blacklist max17042_battery
install max17042_battery /bin/false
