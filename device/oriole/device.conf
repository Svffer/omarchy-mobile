# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 6 (oriole). Community port, issue #2.
#
# Values come from Google's public factory image oriole-cp3a.261005.002.a1,
# the upstream gs101 device trees and read-only queries of a stock phone;
# see NOTES.md. Values marked [I] are inferences still to confirm on a
# phone. Format and keys: docs/RELEASES.md and device/cheetah/device.conf.
# No shell: data only.

# --- Identity ---
CODENAME=oriole
NAME="Pixel 6"
SOC=gs101
# First string of the upstream DT root compatible (gs101-oriole.dts).
COMPATIBLE="google,gs101-oriole"
PACKAGE=omamobile-device-oriole

# --- Kernel and device tree ---
DTB=exynos/google/gs101-oriole.dtb
# The factory image's vendor_boot carries two base DTBs, soc_id
# <0x9845000 0x00> and <0x9845001 0x00>. The labels follow cheetah's
# (0x...001 = b0) [I]; which value a retail Pixel 6 has is [I]. Upstream's
# gs101 DTs carry no /soc_id yet, so bin/omamobile images refuses them until
# our board DTS adds one (NOTES.md).
SOC_IDS="b0:0x9845001 a0:0x9845000"

# --- Bootloader glue ---
# Stock dtbo.img has three oriole board_ids (0x20302, 0x20303, 0x20304; the
# S6E3FC3 panel and ST FTS touch). A retail phone (MP1.0) boots entry 0,
# 0x20304/0x10000 (ro.boot.dtbo_idx = 0).
DTBO_SOURCE=oriole-m1-overlay.dts
DTBO_BOARD_ID=0x20304
DTBO_BOARD_REV=0x10000
# Stock /chosen/bootargs uses earlycon=exynos4210,mmio32,0x10A00000: the
# same UART address as gs201. The rest is cheetah's line, unchanged [I].
VENDOR_CMDLINE="console=tty0 earlycon=exynos4210,0x10A00000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
# vendor_boot page size from the stock header (v4). Without init_boot, the
# OS version and patch level go in the boot header; these are the factory
# image's (Android 17), here the build of the phone the port runs on,
# oriole-cp2a.260705.006 (NOTES.md 2026-11-08) [V]. Stock's GKI boot header
# leaves os_version at 0, so these two are informational; the AVB values
# below are the ones ABL reads.
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-07

# --- Verified boot ---
# [V] Stock vbmeta chains boot (rollback index location 2) and holds
# vendor_boot and dtbo as hash descriptors (oriole-cp2a.260705.006's
# vbmeta.img, and vbmeta_a/_b read from a Pixel 6, NOTES.md 2026-11-08), as
# on bluejay: libavb takes a chained partition with no footer as invalid
# metadata, which an unlocked ABL doesn't let through, so slot B's boot gets
# a footer padded to its partition size (getvar partition-size:boot_b =
# 0x4000000 [V]); vendor_boot and dtbo need none. The index and the patch are
# that build's own boot footer's, never higher (RELEASES.md section 3): a
# phone on a newer stock build has a higher index of its own (bluejay's
# notes read 1791158400 / 2026-10-05 from CP3A.261005.002.A1 [I] for oriole).
AVB_FOOTERS="boot:0x4000000"
AVB_ROLLBACK_INDEX=1783209600
AVB_SECURITY_PATCH=2026-07-05

# --- Storage guard ---
# The Pixel 6 has no init_boot or vendor_kernel_boot partition (the factory
# image, and fastboot getvar all on a retail phone), so vendor_boot carries
# the DTB and our initramfs.
BOOT_IMAGES="boot vendor_boot dtbo"
UFS_RW="boot_b vendor_boot_b dtbo_b userdata"

# --- Initramfs ---
# The shared init, which takes the guard's allowlist from UFS_RW above.
# No SIMPLEFB_TRIG_CON until gs101's DECON register (0x1c300030) has been
# read on a phone, and no BRINGUP_PROBE: the init writes and reads no
# display register here.
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2400
